server:
  port: 8083

# Plan G+: Actuator 暴露 reranker 监控 endpoint
# 列全 health/info/rerank-stats，避免只写 rerank-stats 把默认 health 关掉
management:
  endpoints:
    web:
      exposure:
        include: health,info,rerank-stats

spring:
  application:
    name: hm-dianping
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/hm-dianping?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: 123456
  ai:
    openai:
      # Spring AI 1.1.x 起 chat client 默认 completions-path = /v1/chat/completions，
      # base-url 不要带 /v1 后缀（1.0.x 是相反的，要带 /v1）。embedding 配置同此规则
      # Plan G+: chat 切到小米 MiMo 平台（OpenAI 兼容 + 国内直连 + 真 tool calling 支持，1.2s 响应）
      # 反代不支持 tool calling（验证过 composer-2-fast/sonnet-4.5/kimi-k2.5/gpt-5.4 全失败），SF Clash HTTP/2 timeout，唯一可行的就是 MiMo
      base-url: ${SPRING_AI_OPENAI_BASE_URL:https://token-plan-cn.xiaomimimo.com}
      api-key: ${SPRING_AI_OPENAI_API_KEY:***REMOVED_MIMO_KEY***}
      chat:
        options:
          model: ${SPRING_AI_OPENAI_CHAT_MODEL:mimo-v2.5}
          temperature: ${SPRING_AI_OPENAI_CHAT_TEMPERATURE:0.3}
      embedding:
        # embedding 仍走 SiliconFlow（MiMo 不提供 embedding API），需要单独 api-key 否则会继承 chat 的 MiMo key 导致 401
        base-url: ${SPRING_AI_OPENAI_EMBEDDING_BASE_URL:https://api.siliconflow.cn}
        api-key: ${SPRING_AI_OPENAI_EMBEDDING_API_KEY:***REMOVED_SILICONFLOW_KEY***}
        options:
          model: ${SPRING_AI_OPENAI_EMBEDDING_MODEL:BAAI/bge-m3}
    vectorstore:
      milvus:
        initialize-schema: ${SPRING_AI_MILVUS_INITIALIZE_SCHEMA:true}
        database-name: ${SPRING_AI_MILVUS_DATABASE_NAME:default}
        embedding-dimension: ${SPRING_AI_MILVUS_EMBEDDING_DIMENSION:1024}
        client:
          host: ${SPRING_AI_MILVUS_HOST:localhost}
          port: ${SPRING_AI_MILVUS_PORT:19530}
    # Plan: Tavily 远程 MCP server（标准 MCP JSON-RPC over SSE）
    # 默认 enabled=false 业务启动不连远端；application-local.yaml 启用并注入 TAVILY_API_KEY
    mcp:
      client:
        enabled: ${TAVILY_MCP_ENABLED:false}
        type: SYNC
        request-timeout: 30s
        sse:
          connections:
            tavily:
              url: https://mcp.tavily.com/mcp/?tavilyApiKey=${TAVILY_API_KEY:}
  redis:
    password: 123456
    host: localhost
    port: 6379
    lettuce:
      pool:
        max-active: 10
        max-idle: 10
        min-idle: 1
        time-between-eviction-runs: 10s
  jackson:
    default-property-inclusion: non_null

logging:
  level:
    com.hmdp: info

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    type-aliases-package: com.hmdp.entity

rocketmq:
  name-server: localhost:9876
  producer:
    group: hmdp-producer-group
    # Plan E 压测：默认 3000ms 在 500 并发下会超时（broker 处理不过来），调到 30s
    send-message-timeout: 30000

ai:
  agent:
    bootstrap:
      enabled: ${AI_AGENT_BOOTSTRAP_ENABLED:true}
      fail-fast: ${AI_AGENT_BOOTSTRAP_FAIL_FAST:false}
    memory:
      window-size: ${AI_AGENT_MEMORY_WINDOW_SIZE:8}
    model:
      connect-timeout-seconds: ${AI_AGENT_MODEL_CONNECT_TIMEOUT_SECONDS:10}
      read-timeout-seconds: ${AI_AGENT_MODEL_READ_TIMEOUT_SECONDS:90}
      write-timeout-seconds: ${AI_AGENT_MODEL_WRITE_TIMEOUT_SECONDS:90}
      call-timeout-seconds: ${AI_AGENT_MODEL_CALL_TIMEOUT_SECONDS:120}
    streaming:
      enabled: ${AI_AGENT_STREAMING_ENABLED:true}
      timeout-seconds: ${AI_AGENT_STREAMING_TIMEOUT_SECONDS:75}
      fallback-chunk-size: ${AI_AGENT_STREAMING_FALLBACK_CHUNK_SIZE:24}
    insight:
      max-review-samples: ${AI_AGENT_INSIGHT_MAX_REVIEW_SAMPLES:8}
      max-review-chars-per-sample: ${AI_AGENT_INSIGHT_MAX_REVIEW_CHARS_PER_SAMPLE:280}
      max-combined-chars: ${AI_AGENT_INSIGHT_MAX_COMBINED_CHARS:2200}
      max-vector-hits: ${AI_AGENT_INSIGHT_MAX_VECTOR_HITS:4}
      max-vector-hit-chars: ${AI_AGENT_INSIGHT_MAX_VECTOR_HIT_CHARS:180}
    multi-agent:
      max-steps: ${AI_AGENT_MULTI_AGENT_MAX_STEPS:20}
    rag:
      top-k: ${AI_AGENT_RAG_TOP_K:5}
      similarity-threshold: ${AI_AGENT_RAG_SIMILARITY_THRESHOLD:0.65}
      knowledge-similarity-threshold: ${AI_AGENT_RAG_KNOWLEDGE_SIMILARITY_THRESHOLD:0.35}
      collections:
        knowledge: knowledge_vector
        shop-profile: shop_profile_vector
        blog-review: blog_review_vector
    # Plan: 和风天气真实 API（API KEY 鉴权模式）。
    # 默认 enabled=false 业务启动不强求；application-local.yaml 启用并填真实值。
    # 鉴权方式：URL 拼 ?key=<apiKey>，无需 JWT/PEM。
    qweather:
      enabled: ${QWEATHER_ENABLED:false}
      api-host: ${QWEATHER_API_HOST:}
      api-key: ${QWEATHER_API_KEY:}
      timeout-millis: ${QWEATHER_TIMEOUT_MILLIS:3000}
    # Plan A: 会话软删 + cron 物理清理 (ConversationCleanupTask)
    conversation:
      retention-days: ${AI_CONVERSATION_RETENTION_DAYS:30}
      cleanup-cron: ${AI_CONVERSATION_CLEANUP_CRON:0 0 3 * * ?}

# Caffeine 本地缓存开关（true=启用二级缓存，false=退回纯 Redis 模式）
caffeine:
  enabled: true

# ===== RAG 评估框架（Plan B）=====
rag:
  ingest:
    data-dir: F:/project/data-prep/output
    batch-size: 100
    embedding-retry: 3
  eval:
    output-dir: ./docs
    thresholds: 0.5,0.6,0.65,0.7
    top-k-list: 3,5,10
    max-top-k: 10
    failure-case-limit: 8
    # ===== LLM-as-judge (Plan C) =====
    # base-url 默认指向用户本地 OpenAI-compatible 反代；api-key 默认留空必须通过环境变量注入
    # 跑测试前 export LLM_JUDGE_API_KEY=sk-xxx 或在 IDE Run Configuration 注入
    llm-judge:
      # 默认 false：业务启动不会拉起 judge bean。EvalRunnerTest 用 @SpringBootTest properties 显式打开
      enabled: ${LLM_JUDGE_ENABLED:false}
      # batch-mode=true：单 query 批判 top-K（一次 LLM 调用判 N 个 doc）→ 50 calls 完成全量评估，省配额。
      # batch-mode=false：每对 (query, doc) 一次调用 → 500 calls，配额贵但失败粒度细 + 质量基线。
      # 若买真按 token 计费的订阅（如 Anthropic API 直连），改 false 拿更高质量。
      batch-mode: ${LLM_JUDGE_BATCH_MODE:true}
      # copilot-api 反代实测 10 并发 4s 全成功，3 路是安全裕度。
      # Spring AI 内部 RetryTemplate 已在 LlmJudge.init() 里关掉（maxAttempts=1），不会和我代码层双层重试
      concurrency: 3
      max-retries: 3
      retry-base-sleep-ms: 1000
      doc-content-truncate: 300
      cache-enabled: true
      # 注意：Spring AI 的 OpenAiApi 默认 completionsPath=/v1/chat/completions，
      # base-url 不要带 /v1 后缀，否则会拼成双 /v1/v1 → 404
      #
      # Plan G：默认切 4647 + composer-2-fast
      # 实测对照（20 query × 二元判断 100% 一致）：composer-2-fast 11.8s P50 / sonnet-4.5 17.7s P50
      # 即 composer 与 sonnet 评分等价 + 速度快 47%。Plan F 全量评估用 sonnet 跑 73 分钟，估算 composer 38 分钟
      # 关键：judge prompt 加"不要做搜索，不要说我会搜索，直接基于给出的信息评分"防御行（composer 是代码补全模型，没这一行会进搜索代码库模式）
      # fallback 选项（环境变量 override）：
      #   sonnet-4.5（4647）         → LLM_JUDGE_BASE_URL=http://127.0.0.1:4647 LLM_JUDGE_MODEL=sonnet-4.5 LLM_JUDGE_API_KEY=dummy
      #   claude-haiku-4.5（4141）   → LLM_JUDGE_BASE_URL=http://127.0.0.1:4141 LLM_JUDGE_MODEL=claude-haiku-4.5 LLM_JUDGE_API_KEY=dummy
      base-url: ${LLM_JUDGE_BASE_URL:http://127.0.0.1:4647}
      api-key: ${LLM_JUDGE_API_KEY:dummy}
      model: ${LLM_JUDGE_MODEL:composer-2-fast}
    # ===== Generation 层评估 (Plan D) =====
    # 业务模型 (Qwen2.5-7B) 生成 answer，judge 模型 (Claude Haiku 4.5) 评 faithfulness + relevancy
    # judge 模型复用 llm-judge.* 的 base-url/api-key/model（GenerationJudge lazy init 一份独立 ChatModel）
    generation:
      # 默认 false：业务启动不会拉起 generation evaluator。EvalRunnerTest 用 properties 显式打开
      enabled: ${RAG_EVAL_GENERATION_ENABLED:false}
      # Plan E: retrieval mode 切换。vector=纯向量（Plan D 默认），hybrid=向量+BM25 RRF 合并
      retrieval-mode: ${RAG_EVAL_RETRIEVAL_MODE:hybrid}
      top-k: 5                       # 喂给 generation 的 contexts 数量
      generation-temperature: 0.0    # 业务 ChatModel 评估时降到 0，保证可重现
      generation-max-tokens: 400     # 200 字答案够用
      context-truncate: 200          # 单条 context 字数上限
      contexts-total-truncate: 800   # 拼好的总 contexts 字数上限（faithfulness prompt 用）
      answer-truncate: 400           # answer 喂给 judge 时的字数上限
      concurrency: 5                 # Plan H：从 2 提到 5，配合 200 条 query 评估加速。4647 反代实测 5 并发稳定（max-retries 3 兜底）
      max-retries: 3
      retry-base-sleep-ms: 1000
      sample-detail-count: 8         # report 里 dump 几条详情
      cache-enabled: true

  # Plan E: BM25 + Hybrid Search（修复 generation relevancy 0.28）
  bm25:
    # Plan G+: 业务侧默认开启 hybrid 检索；可通过 RAG_BM25_ENABLED=false 降级回纯 vector
    enabled: ${RAG_BM25_ENABLED:true}
    # JSONL 数据来源（与 rag.ingest.data-dir 一致，但 BM25 索引独立从文件读，不依赖 Milvus）
    data-dir: ${RAG_BM25_DATA_DIR:F:/project/data-prep/output}
  hybrid:
    rrf-k: 60          # RRF 默认参数（业界标准）
    fetch-k: 20        # 每个 retriever 各拿 20，合并后取最终 topK

  # Plan G: Cross-encoder Reranker（修复 hybrid 之后 shop relevancy 留在 0.350 的问题）
  # 召回完 top-K 后用 BAAI/bge-reranker-v2-m3 对 (query, doc) 对精排，cross-encoder 评分
  rerank:
    # Plan G+: 业务侧默认开启 cross-encoder 精排；可通过 RAG_RERANK_ENABLED=false 降级回 hybrid
    enabled: ${RAG_RERANK_ENABLED:true}
    # SiliconFlow rerank 端点（OpenAI / Cohere-style schema：POST /v1/rerank）
    base-url: ${RAG_RERANK_BASE_URL:https://api.siliconflow.cn}
    # 业务 chat 已切到 cursor 反代(spring.ai.openai.api-key=dummy)，rerank 仍需真实 SiliconFlow key
    api-key: ${RAG_RERANK_API_KEY:***REMOVED_SILICONFLOW_KEY***}
    model: ${RAG_RERANK_MODEL:BAAI/bge-reranker-v2-m3}
    # 业务路径单次调用 3 秒兜底（worst case = 3s + 200ms + 3s = 6.2s 而非 15s）
    timeout-ms: ${RAG_RERANK_TIMEOUT_MS:3000}
    # 失败重试次数（除首次调用，再试 N 次）；业务路径只重试 1 次，评估场景可通过 env 调高
    max-retries: ${RAG_RERANK_MAX_RETRIES:1}

  # Plan G+: 业务侧 RAG 检索模式（vector / hybrid / hybrid+rerank）
  # 默认 hybrid+rerank 跑全量升级；演示翻车时可通过 RAG_BUSINESS_RETRIEVAL_MODE=vector 一键降级
  # 注意：searchBlogReviewsByShop 因 shopId metadata filter 强约束，不参与 mode 切换，恒走纯 vector
  business:
    retrieval-mode: ${RAG_BUSINESS_RETRIEVAL_MODE:hybrid+rerank}